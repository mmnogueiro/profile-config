<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="presentation">
<defs><clipPath id="L"><rect width="450" height="44"/></clipPath><clipPath id="R"><rect x="450" width="450" height="44"/></clipPath>
<filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  .fw{animation:fw 4s linear infinite}@keyframes fw{from{transform:translateX(100px)}to{transform:translateX(800px)}}
  .bw{animation:bw 4s linear 2s infinite;transform:translateX(800px)}@keyframes bw{from{transform:translateX(800px)}to{transform:translateX(100px)}}
  .tap{transform-origin:450px 22px;animation:tap 2s ease-out infinite}@keyframes tap{0%{transform:scale(.6);opacity:.9}60%,100%{transform:scale(1.8);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.bw{display:none}.fw{transform:translateX(250px)}}
</style>
<!-- wire -->
<line x1="84" y1="22" x2="816" y2="22" stroke="#808080" stroke-opacity=".35" stroke-dasharray="2 6" stroke-linecap="round"/>
<!-- client (laptop) -->
<g fill="none" stroke="#a9c9ff" stroke-width="1.4" stroke-linejoin="round">
  <rect x="56" y="12" width="22" height="15" rx="2" fill="#367bf0" fill-opacity=".15"/>
  <path d="M52 30H82L80 32.5H54Z" fill="#a9c9ff" fill-opacity=".3"/>
</g>
<!-- server -->
<g fill="none" stroke="#a9c9ff" stroke-width="1.4">
  <rect x="822" y="10" width="22" height="11" rx="2" fill="#367bf0" fill-opacity=".15"/>
  <rect x="822" y="23" width="22" height="11" rx="2" fill="#367bf0" fill-opacity=".15"/>
</g>
<circle cx="828" cy="15.5" r="1.4" fill="#4ade80"/><circle cx="828" cy="28.5" r="1.4" fill="#4ade80"/>
<path d="M833 15.5H840M833 28.5H840" stroke="#a9c9ff" stroke-opacity=".5" stroke-linecap="round"/>
<!-- packets: clean until the attacker, tampered after -->
<g clip-path="url(#L)">
  <g class="fw"><g transform="translate(0 22)"><g><rect x="-11" y="-6" width="22" height="12" rx="3.5" fill="#1d3a6b" stroke="#6aa8ff"/><path d="M-2.2 0V-1.6a2.2 2.2 0 0 1 4.4 0V0" fill="none" stroke="#a9c9ff" stroke-width="1.1"/><rect x="-3.2" y="0" width="6.4" height="3.6" rx=".8" fill="#a9c9ff"/></g></g></g>
  <g class="bw"><g transform="translate(0 22)"><g><rect x="-11" y="-6" width="22" height="12" rx="3.5" fill="#4a1218" stroke="#ef4444" filter="url(#neon)"/><path d="M-2.2 -.6V-2.8a2.2 2.2 0 0 1 4.4 0" fill="none" stroke="#fca5a5" stroke-width="1.1"/><rect x="-3.2" y="0" width="6.4" height="3.6" rx=".8" fill="#fca5a5"/></g></g></g>
</g>
<g clip-path="url(#R)">
  <g class="fw"><g transform="translate(0 22)"><g><rect x="-11" y="-6" width="22" height="12" rx="3.5" fill="#4a1218" stroke="#ef4444" filter="url(#neon)"/><path d="M-2.2 -.6V-2.8a2.2 2.2 0 0 1 4.4 0" fill="none" stroke="#fca5a5" stroke-width="1.1"/><rect x="-3.2" y="0" width="6.4" height="3.6" rx=".8" fill="#fca5a5"/></g></g></g>
  <g class="bw"><g transform="translate(0 22)"><g><rect x="-11" y="-6" width="22" height="12" rx="3.5" fill="#1d3a6b" stroke="#6aa8ff"/><path d="M-2.2 0V-1.6a2.2 2.2 0 0 1 4.4 0V0" fill="none" stroke="#a9c9ff" stroke-width="1.1"/><rect x="-3.2" y="0" width="6.4" height="3.6" rx=".8" fill="#a9c9ff"/></g></g></g>
</g>
<!-- attacker in the middle -->
<circle class="tap" cx="450" cy="22" r="11" fill="none" stroke="#ef4444" stroke-width="1.2"/>
<circle cx="450" cy="22" r="11" fill="#0d1017" stroke="#ef4444" stroke-opacity=".7" stroke-width="1.2"/>
<g filter="url(#neon)" transform="translate(450 22.5) scale(.95)"><path d="M0-6.2C-3.6-6.2-5.4-3.6-5.4-.8C-5.4 1.2-4.4 2.4-3.2 3V5H3.2V3C4.4 2.4 5.4 1.2 5.4-.8C5.4-3.6 3.6-6.2 0-6.2Z" fill="#ef4444"/><ellipse cx="-2.1" cy="-.6" rx="1.45" ry="1.6" fill="#0d1017"/><ellipse cx="2.1" cy="-.6" rx="1.45" ry="1.6" fill="#0d1017"/><path d="M0 1.1L-.8 2.5H.8Z" fill="#0d1017"/><path d="M-1.6 3.4V5M0 3.4V5M1.6 3.4V5" stroke="#0d1017" stroke-width=".55"/></g>
</svg>
