<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Miguel Nogueiro. Full-stack developer moving into offensive security. Computer Science and Engineering student at NOVA FCT.">
<defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#4ade80" stroke-opacity=".06"/></pattern>
  <radialGradient id="glow" cx="750" cy="160" r="230" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4ade80" stop-opacity=".13"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0"/><stop offset="1" stop-color="#4ade80" stop-opacity=".55"/></linearGradient>
  <clipPath id="card"><rect width="900" height="300" rx="14"/></clipPath>
  <clipPath id="shield"><path d="M750 72L815 96V160C815 205 785 232 750 248C715 232 685 205 685 160V96Z"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .prompt{font-size:15px;fill:#4ade80}
  .cmd{font-size:15px;fill:#e5e7eb}
  .bar{font-size:12px;fill:#6b7280}
  .name{font-size:56px;font-weight:700;letter-spacing:-1.5px;fill:#f9fafb}
  .role{font-size:21px;fill:#d1d5db}
  .acc{font-size:20px;fill:#4ade80}
  .out{font-size:14px;fill:#9ca3af}
  .pill{font-size:11px;fill:#d1d5db}
  .cover{transform-origin:right center}
  .t1{animation:wipe .7s steps(7) .5s both}
  .t2{animation:wipe 1s steps(13) 2.1s both}
  @keyframes wipe{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .in{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .sweep{animation:sweep 3.4s ease-in-out infinite alternate}
  @keyframes sweep{from{transform:translateY(-30px)}to{transform:translateY(178px)}}
  .ring{transform-origin:750px 160px;animation:spin 40s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.cover{display:none}}
</style>
<g clip-path="url(#card)">
  <rect width="900" height="300" fill="#0a0d0b"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <rect width="900" height="300" fill="url(#glow)"/>

  <!-- window chrome -->
  <rect width="900" height="40" fill="#111512"/>
  <rect y="40" width="900" height="1" fill="#ffffff" fill-opacity=".07"/>
  <circle cx="24" cy="20" r="6" fill="#f87171" fill-opacity=".85"/>
  <circle cx="44" cy="20" r="6" fill="#fbbf24" fill-opacity=".85"/>
  <circle cx="64" cy="20" r="6" fill="#4ade80" fill-opacity=".85"/>
  <text class="mono bar" x="450" y="24" text-anchor="middle">miguel@nova-fct: ~</text>

  <!-- $ whoami -->
  <text class="mono prompt" x="40" y="86" textLength="126">miguel@nova:~$</text>
  <text class="mono cmd" x="175" y="86" textLength="54">whoami</text>
  <rect class="cover t1" x="173" y="70" width="62" height="22" fill="#0a0d0b"/>

  <text class="sans name in" x="38" y="148" style="animation-delay:1.3s">Miguel Nogueiro</text>
  <text class="in" x="40" y="186" style="animation-delay:1.7s"><tspan class="sans role">Full-stack developer  →  </tspan><tspan class="mono acc">offensive security</tspan></text>

  <!-- $ cat focus.txt -->
  <text class="mono prompt" x="40" y="232" textLength="126">miguel@nova:~$</text>
  <text class="mono cmd" x="175" y="232" textLength="117">cat focus.txt</text>
  <rect class="cover t2" x="173" y="216" width="124" height="22" fill="#0a0d0b"/>
  <g class="in" style="animation-delay:3.2s">
    <text class="mono out" x="40" y="262" textLength="386">web app security · pentesting · student tools</text>
    <rect class="blink" x="434" y="250" width="9" height="16" fill="#4ade80"/>
  </g>

  <!-- shield -->
  <g fill="none" stroke="#4ade80">
    <circle class="ring" cx="750" cy="160" r="108" stroke-opacity=".16" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="M750 72L815 96V160C815 205 785 232 750 248C715 232 685 205 685 160V96Z" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M750 96L796 113V160C796 192 775 211 750 223C725 211 704 192 704 160V113Z" stroke-opacity=".22"/>
  </g>
  <g clip-path="url(#shield)">
    <rect class="sweep" x="685" y="72" width="130" height="30" fill="url(#scan)"/>
  </g>
  <circle cx="750" cy="152" r="9" fill="#4ade80" fill-opacity=".9"/>
  <path d="M745 157L742 182H758L755 157Z" fill="#4ade80" fill-opacity=".9"/>

  <!-- status pills -->
  <g class="in" style="animation-delay:3.6s">
    <rect x="654" y="258" width="62" height="22" rx="6" fill="#4ade80" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".35"/>
    <text class="mono pill" x="685" y="273" text-anchor="middle">SEC0 ✓</text>
    <rect x="722" y="258" width="62" height="22" rx="6" fill="#4ade80" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".35"/>
    <text class="mono pill" x="753" y="273" text-anchor="middle">SEC1 ✓</text>
    <rect x="790" y="258" width="66" height="22" rx="6" fill="none" stroke="#9ca3af" stroke-opacity=".35" stroke-dasharray="3 3"/>
    <text class="mono pill" x="823" y="273" text-anchor="middle" fill-opacity=".7">CTFs ▸</text>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="299" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
