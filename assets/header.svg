<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Miguel Nogueiro. Focus: software development and cybersecurity. Hacker laptops attack a shielded application and are denied access.">
<defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#367bf0" stroke-opacity=".07"/></pattern>
  <pattern id="hex" width="10" height="17.32" patternUnits="userSpaceOnUse"><path d="M5 0L10 2.9V8.7L5 11.5L0 8.7V2.9ZM5 11.5V17.32" fill="none" stroke="#8ab4ff" stroke-opacity=".14"/></pattern>
  <radialGradient id="glow" cx="748" cy="162" r="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#367bf0" stop-opacity=".26"/><stop offset="1" stop-color="#367bf0" stop-opacity="0"/></radialGradient>
  <radialGradient id="redL" cx="634" cy="165" r="105" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ef4444" stop-opacity=".13"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  <radialGradient id="redR" cx="862" cy="165" r="105" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ef4444" stop-opacity=".13"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  <radialGradient id="shieldFill" cx="748" cy="150" r="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#367bf0" stop-opacity=".34"/><stop offset="1" stop-color="#367bf0" stop-opacity=".06"/></radialGradient>
  <!-- hacker materials -->
  <linearGradient id="hoodG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset=".55" stop-color="#1d222c"/><stop offset="1" stop-color="#0e1117"/></linearGradient>
  <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262c38"/><stop offset="1" stop-color="#0d1015"/></linearGradient>
  <radialGradient id="faceLit" cx=".5" cy="1" r=".9"><stop offset="0" stop-color="#ff5a5a" stop-opacity=".55"/><stop offset=".6" stop-color="#7a1d1d" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="lidG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4352"/><stop offset=".5" stop-color="#262c37"/><stop offset="1" stop-color="#171b23"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="card"><rect width="900" height="300" rx="14"/></clipPath>
  <clipPath id="sh"><path d="M748 98L792 114V162C792 194 771 214 748 226C725 214 704 194 704 162V114Z"/></clipPath>

  <!-- attacker laptop with a skull on screen, 56x42 -->
  <radialGradient id="scr" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#4a0f14"/><stop offset="1" stop-color="#12060a"/></radialGradient>
  <symbol id="hacker" viewBox="0 0 56 42" overflow="visible">
    <rect x="4" y="0" width="48" height="36" rx="6" fill="#ff3b3b" fill-opacity=".22" filter="url(#blur4)"/>
    <rect x="6.5" y="2.5" width="43" height="30" rx="3" fill="#1a1f2b" stroke="#4a5263"/>
    <rect x="9" y="5" width="38" height="25" rx="1.2" fill="url(#scr)"/>
    <path d="M12 26.5h8M22 26.5h5M12 8.5h4" stroke="#ff4d4d" stroke-opacity=".45" stroke-linecap="round"/>
    <g class="skull" filter="url(#neon)" transform="translate(28 16.5) scale(1.25)">
      <path d="M0-6.2C-3.6-6.2-5.4-3.6-5.4-.8C-5.4 1.2-4.4 2.4-3.2 3V5H3.2V3C4.4 2.4 5.4 1.2 5.4-.8C5.4-3.6 3.6-6.2 0-6.2Z" fill="#ff4d4d"/>
      <ellipse cx="-2.1" cy="-.6" rx="1.45" ry="1.6" fill="#12060a"/>
      <ellipse cx="2.1" cy="-.6" rx="1.45" ry="1.6" fill="#12060a"/>
      <path d="M0 1.1L-.8 2.5H.8Z" fill="#12060a"/>
      <path d="M-1.6 3.4V5M0 3.4V5M1.6 3.4V5" stroke="#12060a" stroke-width=".55"/>
    </g>
    <path d="M2 34H54L51 39.5H5Z" fill="#2f3644"/>
    <path d="M2 34H54" stroke="#5a6375"/>
    <rect x="23" y="34" width="10" height="1.6" rx=".8" fill="#1a1f2b"/>
  </symbol>
</defs>
<style>
  .mono{font-family:ui-monospace,'DejaVu Sans Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:Cantarell,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  .ln{font-size:15px;fill:#367bf0}
  .usr{font-size:15px;font-weight:700;fill:#8ab4ff}
  .dir{font-size:15px;font-weight:700;fill:#f3f4f6}
  .dol{font-size:15px;font-weight:700;fill:#8ab4ff}
  .cmd{font-size:15px;fill:#e5e7eb}
  .bar{font-size:12px;fill:#c9ced6}
  .menu{font-size:11px;fill:#8b93a1}
  .name{font-size:56px;font-weight:700;letter-spacing:-1.5px;fill:#f9fafb}
  .out{font-size:15px;fill:#c9ced6}
  .cover{transform-origin:right center}
  .t1{animation:wipe .7s steps(7) .5s both}
  .t2{animation:wipe 1s steps(13) 2.1s both}
  @keyframes wipe{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .in{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .shield{animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{50%{stroke-opacity:.55}}
  .aura{transform-origin:748px 162px;animation:aura 2.8s ease-out infinite}
  @keyframes aura{from{transform:scale(.94);opacity:.5}to{transform:scale(1.22);opacity:0}}
  .skull{animation:flick 3.2s steps(1) infinite}
  @keyframes flick{93%{opacity:.5}96%{opacity:1}}
  .bolt{stroke-dasharray:24 200;stroke-dashoffset:24;animation:bolt 2.8s ease-in infinite}
  @keyframes bolt{0%{stroke-dashoffset:24;opacity:1}38%{stroke-dashoffset:-76;opacity:1}40%,100%{stroke-dashoffset:-76;opacity:0}}
  .hit{transform-box:fill-box;transform-origin:center;opacity:0;animation:hit 2.8s ease-out infinite}
  @keyframes hit{0%,37%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.6)}}
  .spark{opacity:0;animation:spark 2.8s ease-out infinite}
  @keyframes spark{0%,37%{opacity:0}40%{opacity:1}60%,100%{opacity:0}}
  .d1{animation-delay:.7s}.d2{animation-delay:1.4s}.d3{animation-delay:2.1s}
  .deny{animation:deny 1.4s steps(1) infinite}
  @keyframes deny{50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.cover{display:none}.hit,.spark{opacity:0}}
</style>
<g clip-path="url(#card)">
  <rect width="900" height="300" fill="#0d1017"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <rect width="900" height="300" fill="url(#glow)"/>
  <rect width="900" height="300" fill="url(#redL)"/>
  <rect width="900" height="300" fill="url(#redR)"/>

  <!-- window chrome (Xfce / Kali-Dark style) -->
  <rect width="900" height="30" fill="#1c1f26"/>
  <g fill="none" stroke="#367bf0" stroke-width="1.4">
    <rect x="16" y="9" width="16" height="12" rx="2"/>
    <path d="M19 13l3 2-3 2M24 18h4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="sans bar" x="450" y="19.5" text-anchor="middle">dev@sec: ~</text>
  <g fill="none" stroke="#c9ced6" stroke-width="1.4" stroke-linecap="round">
    <path d="M820 15h10"/>
    <rect x="845" y="10" width="10" height="10" rx="1"/>
    <path d="M871 10l10 10M881 10l-10 10"/>
  </g>
  <rect y="30" width="900" height="20" fill="#16191f"/>
  <text class="sans menu" x="16" y="44" word-spacing="14">File Actions Edit View Help</text>
  <rect y="50" width="900" height="1" fill="#ffffff" fill-opacity=".07"/>

  <!-- ┌──(dev㉿sec)-[~]  └─$ whoami -->
  <text class="mono ln" x="40" y="82" textLength="36">┌──(</text>
  <text class="mono usr" x="76" y="82" textLength="63">dev㉿sec</text>
  <text class="mono ln" x="139" y="82" textLength="27">)-[</text>
  <text class="mono dir" x="166" y="82">~</text>
  <text class="mono ln" x="175" y="82">]</text>
  <text class="mono ln" x="40" y="104" textLength="18">└─</text>
  <text class="mono dol" x="58" y="104">$</text>
  <text class="mono cmd" x="76" y="104" textLength="54">whoami</text>
  <rect class="cover t1" x="74" y="88" width="62" height="22" fill="#0d1017"/>

  <text class="sans name in" x="38" y="164" style="animation-delay:1.3s">Miguel Nogueiro</text>

  <!-- ┌──(dev㉿sec)-[~]  └─$ cat focus.txt -->
  <text class="mono ln" x="40" y="206" textLength="36">┌──(</text>
  <text class="mono usr" x="76" y="206" textLength="63">dev㉿sec</text>
  <text class="mono ln" x="139" y="206" textLength="27">)-[</text>
  <text class="mono dir" x="166" y="206">~</text>
  <text class="mono ln" x="175" y="206">]</text>
  <text class="mono ln" x="40" y="228" textLength="18">└─</text>
  <text class="mono dol" x="58" y="228">$</text>
  <text class="mono cmd" x="76" y="228" textLength="117">cat focus.txt</text>
  <rect class="cover t2" x="74" y="212" width="124" height="22" fill="#0d1017"/>
  <g class="in" style="animation-delay:3.2s">
    <text class="mono out" x="40" y="260" textLength="180">software development</text>
    <circle cx="236" cy="255" r="2.5" fill="#367bf0"/>
    <text class="mono out" x="252" y="260" textLength="117">cybersecurity</text>
    <rect class="blink" x="380" y="247" width="9" height="17" fill="#367bf0"/>
  </g>

  <!-- ================= hackers vs shielded application ================= -->
  <g stroke="#ef4444" stroke-opacity=".18" stroke-dasharray="2 5">
    <path d="M659 98L704 128"/><path d="M837 98L792 128"/>
    <path d="M659 214L709 188"/><path d="M837 214L787 188"/>
  </g>

  <!-- shield -->
  <path class="aura" d="M748 98L792 114V162C792 194 771 214 748 226C725 214 704 194 704 162V114Z" fill="none" stroke="#5b9bff" stroke-width="2"/>
  <path d="M748 98L792 114V162C792 194 771 214 748 226C725 214 704 194 704 162V114Z" fill="url(#shieldFill)"/>
  <rect x="704" y="98" width="88" height="128" fill="url(#hex)" clip-path="url(#sh)"/>
  <path class="shield" d="M748 98L792 114V162C792 194 771 214 748 226C725 214 704 194 704 162V114Z" fill="none" stroke="#6aa8ff" stroke-width="2" filter="url(#soft)"/>

  <!-- application window -->
  <g filter="url(#neon)">
    <rect x="726" y="134" width="44" height="36" rx="4" fill="#0d1422" stroke="#a9c9ff" stroke-width="1.5"/>
    <path d="M726.8 142H769.2" stroke="#a9c9ff" stroke-opacity=".6"/>
  </g>
  <circle cx="731" cy="138" r="1.2" fill="#a9c9ff"/><circle cx="735" cy="138" r="1.2" fill="#a9c9ff" fill-opacity=".6"/><circle cx="739" cy="138" r="1.2" fill="#a9c9ff" fill-opacity=".4"/>
  <rect x="733" y="147" width="30" height="4" rx="2" fill="#a9c9ff" fill-opacity=".3"/>
  <rect x="733" y="154" width="30" height="4" rx="2" fill="#a9c9ff" fill-opacity=".3"/>
  <rect x="740" y="161.5" width="16" height="4.5" rx="2.2" fill="#6aa8ff"/>
  <g transform="translate(762 162)">
    <circle cx="7" cy="7" r="8.5" fill="#0d1017" stroke="#6aa8ff" stroke-width="1.3"/>
    <path d="M4.5 7V5.3a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="#a9c9ff" stroke-width="1.3"/>
    <rect x="3.4" y="7" width="7.2" height="5.2" rx="1" fill="#6aa8ff"/>
  </g>

  <!-- bolts + impacts -->
  <g stroke="#ff4d4d" stroke-width="2.4" stroke-linecap="round" filter="url(#neon)">
    <path class="bolt" pathLength="100" d="M659 98L704 128"/>
    <path class="bolt d1" pathLength="100" d="M837 98L792 128"/>
    <path class="bolt d2" pathLength="100" d="M659 214L709 188"/>
    <path class="bolt d3" pathLength="100" d="M837 214L787 188"/>
  </g>
  <g fill="none" stroke="#8ab4ff" stroke-width="2">
    <circle class="hit" cx="704" cy="128" r="5"/>
    <circle class="hit d1" cx="792" cy="128" r="5"/>
    <circle class="hit d2" cx="709" cy="188" r="5"/>
    <circle class="hit d3" cx="787" cy="188" r="5"/>
  </g>
  <g fill="#ffb4b4" filter="url(#neon)">
    <g class="spark"><circle cx="699" cy="122" r="1.3"/><circle cx="697" cy="131" r="1.1"/><circle cx="701" cy="135" r=".9"/></g>
    <g class="spark d1"><circle cx="797" cy="122" r="1.3"/><circle cx="799" cy="131" r="1.1"/><circle cx="795" cy="135" r=".9"/></g>
    <g class="spark d2"><circle cx="703" cy="183" r="1.3"/><circle cx="702" cy="192" r="1.1"/><circle cx="706" cy="196" r=".9"/></g>
    <g class="spark d3"><circle cx="793" cy="183" r="1.3"/><circle cx="794" cy="192" r="1.1"/><circle cx="790" cy="196" r=".9"/></g>
  </g>

  <!-- attackers -->
  <use xlink:href="#hacker" href="#hacker" x="610" y="76" width="56" height="42"/>
  <use xlink:href="#hacker" href="#hacker" x="610" y="196" width="56" height="42"/>
  <use xlink:href="#hacker" href="#hacker" x="830" y="76" width="56" height="42"/>
  <use xlink:href="#hacker" href="#hacker" x="830" y="196" width="56" height="42"/>

  <!-- status -->
  <g class="deny">
    <rect x="684" y="246" width="128" height="20" rx="10" fill="#ef4444" fill-opacity=".12" stroke="#ef4444" stroke-opacity=".7"/>
    <text class="mono" x="748" y="260" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fca5a5">ACCESS DENIED</text>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="299" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
